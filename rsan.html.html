<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東大数学問題</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent; /* 押した瞬間の青いハイライトを無効化 */
  }
  body {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS PMincho", serif;
    background-color: #f7f7f7;
    color: #222;
    line-height: 1.7;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 680px;
    background-color: #ffffff;
    border: 1px solid #c0c0c0;
    padding: 40px 30px;
    margin-top: 20px;
    transition: opacity 0.4s ease; /* 画面切り替えのフェード用 */
  }
  h1 {
    font-size: 1.5rem;
    text-align: center;
    margin-bottom: 30px;
    font-weight: normal;
    letter-spacing: 2px;
    border-bottom: 2px solid #333;
    padding-bottom: 10px;
  }
  h2 {
    font-size: 1.1rem;
    margin-bottom: 20px;
    font-weight: normal;
  }
  p {
    margin-bottom: 15px;
  }
  
  input[type="text"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #999;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 20px;
    background-color: #fafafa;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: #333;
  }

  button {
    display: block;
    width: 100%;
    padding: 12px;
    background-color: #333;
    color: #fff;
    border: 1px solid #333;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    margin-bottom: 10px;
    outline: none;
  }
  button:hover {
    background-color: #555;
  }
  button.btn-outline {
    background-color: #fff;
    color: #333;
  }
  button.btn-outline:hover {
    background-color: #f0f0f0;
  }

  .choice-box {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .choice-item {
    position: relative;
  }
  .choice-item input[type="radio"] {
    display: none;
  }
  .choice-label {
    display: block;
    padding: 12px 15px;
    border: 2px solid #ccc;
    background-color: #fff;
    cursor: pointer;
    transition: border-color 0.6s ease, background-color 0.6s ease; /* 枠の色変化をゆっくりに */
    outline: none;
  }
  .choice-label:hover {
    border-color: #999;
  }
  .choice-item input[type="radio"]:checked + .choice-label {
    border-color: #333; /* 枠の色を濃く */
    background-color: #eee;
  }

  /* 正解の緑色：形やサイズは変えず、色だけ脈打たせる */
  .choice-correct {
    border: 2px solid #2e7d32 !important;
    background-color: #e8f5e9 !important;
    color: #1b5e20 !important;
    animation: green-pulse 1.5s infinite ease-in-out;
  }
  @keyframes green-pulse {
    0%, 100% {
      background-color: #e8f5e9;
      border-color: #2e7d32;
    }
    50% {
      background-color: #c8e6c9;
      border-color: #1b5e20;
    }
  }

  /* 不正解の赤色 */
  .choice-incorrect {
    border: 2px solid #c62828 !important;
    background-color: #ffebee !important;
    color: #b71c1c !important;
  }
  .choice-disabled {
    pointer-events: none;
    opacity: 0.8;
  }

  .explanation-box {
    background-color: #f9f9f9;
    border-left: 4px solid #333;
    padding: 20px;
    margin-top: 20px;
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  .explanation-title {
    font-weight: bold;
    margin-bottom: 10px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 5px;
  }
  .result-text-correct { color: #2e7d32; font-weight: bold; margin-bottom: 15px;}
  .result-text-incorrect { color: #c62828; font-weight: bold; margin-bottom: 15px;}

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: left;
  }
  th {
    background-color: #f0f0f0;
    font-weight: normal;
  }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- JavaScriptで描画 -->
</div>

<script>
(function () {
  const questions = [
    {
      question: "定積分 ∫[0→1] x^2 * e^x dx の値として正しいものを選べ。",
      choices: ["e - 1", "e - 2", "2e - 3", "e/2 - 1"],
      correct: 1,
      explanation: "部分積分を2回行います。\n∫ x^2 * e^x dx = x^2 * e^x - ∫ 2x * e^x dx\n= x^2 * e^x - 2(x * e^x - ∫ e^x dx)\n= e^x (x^2 - 2x + 2) + C\n\nx=1 のとき e(1 - 2 + 2) = e\nx=0 のとき e^0(0 - 0 + 2) = 2\nよって、e - 2 となります。"
    },
    {
      question: "2以上の整数 n に対して、2^n + 1 が素数となるための n の条件として最も適切なものを選べ。",
      choices: ["n は奇数である", "n は 2 の累乗である", "n は素数である", "n は 3 の倍数である"],
      correct: 1,
      explanation: "n が奇数の約数 d (d > 1) を持つとすると、n = d * k と表せます。\nこのとき、2^n + 1 = (2^k)^d + 1 となり、d が奇数であることから、これは (2^k + 1) で割り切れます。\nしたがって、2^n + 1 が素数となるには、n は奇数を約数に持たない、すなわち 2 の累乗である必要があります。（フェルマー素数の性質）"
    },
    {
      question: "3人が1回だけジャンケンをするとき、あいこになる確率を求めよ。",
      choices: ["1/3", "1/9", "1/27", "1/2"],
      correct: 0,
      explanation: "3人の手の出し方は 3^3 = 27 通り。\nあいこになるのは以下の2パターンです。\n① 全員が同じ手を出す：3通り（全員グー、全員チョキ、全員パー）\n② 全員が異なる手を出す：3! = 6通り（グー・チョキ・パーの順列）\n\n合計 3 + 6 = 9 通り。\n確率は 9 / 27 = 1/3 となります。"
    },
    {
      question: "複素数平面上において、方程式 z^3 = 1 の解のうち、z = 1 以外の2つの解を α, β とする。このとき |α| + |β| の値を求めよ。",
      choices: ["1", "√2", "√3", "2"],
      correct: 3,
      explanation: "z^3 = 1 の解は、絶対値が 1 の複素数平面上の正三角形の頂点に位置します。\nしたがって、z = 1 以外の解 α, β についても、その絶対値（原点からの距離）はともに 1 です。\nよって |α| + |β| = 1 + 1 = 2 となります。"
    },
    {
      question: "数列 {a_n} を a_1 = 2, a_{n+1} = (1/2)(a_n + 2/a_n) (n ≧ 1) で定める。このとき、lim[n→∞] a_n の値を求めよ。",
      choices: ["1", "√2", "2", "収束しない"],
      correct: 1,
      explanation: "極限値を α と仮定すると、α = (1/2)(α + 2/α) が成り立ちます。\nこれを解くと、2α = α + 2/α より α = 2/α となり、α^2 = 2 です。\na_n > 0 であるため α = √2 となります。（相加相乗平均の関係から a_{n+1} ≧ √2 であり、下に有界で単調減少することを示すことで収束が証明できます）"
    }
  ];

  const STORAGE_KEY = 'todai_math_scores_v1';

  let state = {
    screen: 'start',
    name: '',
    currentQ: 0,
    score: 0,
    selectedAnswer: null,
    isCorrect: false,
    errorMsg: '',
    saved: false,
    isTransitioning: false
  };

  function loadScores() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = JSON.parse(raw || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function saveScore(name, score) {
    const scores = loadScores();
    scores.push({ name: name, score: score, date: Date.now() });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
  }

  function getRankings() {
    const scores = loadScores();
    scores.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.date - b.date;
    });
    return scores.slice(0, 10);
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  const app = document.getElementById('app');

  // 画面切り替え時のフェードアニメーション
  function changeScreen(newScreen, setupCallback) {
    if (state.isTransitioning) return;
    state.isTransitioning = true;
    app.style.opacity = '0';
    
    setTimeout(function() {
      if (setupCallback) setupCallback();
      state.screen = newScreen;
      render();
      
      // 強制リフローでスタイルを反映させてからフェードイン
      void app.offsetWidth;
      app.style.opacity = '1';
      
      setTimeout(function() {
        state.isTransitioning = false;
      }, 400);
    }, 400); // CSSのtransition時間と同じ
  }

  function render() {
    if (state.screen === 'start') {
      app.innerHTML =
        '<h1>東大数学問題</h1>' +
        '<p style="text-align:center; color:#666; margin-bottom:30px;">理IIIレベルの四択問題（全5問）</p>' +
        (state.errorMsg ? '<p style="color:#c62828; margin-bottom:15px;">' + esc(state.errorMsg) + '</p>' : '') +
        '<p>名前を入れてください。</p>' +
        '<input type="text" id="nameInput" placeholder="名前" maxlength="20" value="' + esc(state.name) + '">' +
        '<button id="startBtn">スタート</button>' +
        '<button id="toRankingBtn" class="btn-outline">履歴を見る</button>';

      document.getElementById('startBtn').addEventListener('click', handleStart);
      document.getElementById('toRankingBtn').addEventListener('click', function () {
        changeScreen('ranking');
      });
      document.getElementById('nameInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') handleStart();
      });

    } else if (state.screen === 'quiz') {
      const q = questions[state.currentQ];
      const qNum = state.currentQ + 1;
      
      let choicesHtml = '';
      q.choices.forEach(function(choice, index) {
        choicesHtml += 
          '<div class="choice-item">' +
            '<input type="radio" id="choice' + index + '" name="answer" value="' + index + '">' +
            '<label for="choice' + index + '" class="choice-label">' + (index + 1) + '. ' + esc(choice) + '</label>' +
          '</div>';
      });

      app.innerHTML =
        '<h2>第 ' + qNum + ' 問（全 ' + questions.length + ' 問）</h2>' +
        '<p style="margin-bottom:20px;">' + esc(q.question) + '</p>' +
        '<div class="choice-box">' + choicesHtml + '</div>' +
        '<button id="submitBtn">解答を確定する</button>';

      document.getElementById('submitBtn').addEventListener('click', function () {
        const selected = document.querySelector('input[name="answer"]:checked');
        if (!selected) {
          alert('解答を選択してください。');
          return;
        }
        handleAnswer(parseInt(selected.value, 10));
      });

    } else if (state.screen === 'judge') {
      const q = questions[state.currentQ];
      
      let choicesHtml = '';
      q.choices.forEach(function(choice, index) {
        let labelClass = 'choice-label';
        
        if (index === q.correct) {
          labelClass += ' choice-correct';
        }
        if (index === state.selectedAnswer && !state.isCorrect) {
          labelClass += ' choice-incorrect';
        }

        choicesHtml += 
          '<div class="choice-item choice-disabled">' +
            '<input type="radio" id="choice' + index + '" name="answer" value="' + index + '" ' + (index === state.selectedAnswer ? 'checked' : '') + ' disabled>' +
            '<label for="choice' + index + '" class="' + labelClass + '">' + (index + 1) + '. ' + esc(choice) + '</label>' +
          '</div>';
      });

      const resultMsg = state.isCorrect 
        ? '<p class="result-text-correct">正解です。</p>' 
        : '<p class="result-text-incorrect">不正解です。</p>';

      const isLast = state.currentQ >= questions.length - 1;
      const nextBtnText = isLast ? '結果を表示する' : '次の問題へ';
      const nextBtnId = isLast ? 'toResultBtn' : 'nextBtn';

      app.innerHTML =
        '<h2>第 ' + (state.currentQ + 1) + ' 問 解答・解説</h2>' +
        '<p style="margin-bottom:20px;">' + esc(q.question) + '</p>' +
        '<div class="choice-box">' + choicesHtml + '</div>' +
        resultMsg +
        '<div class="explanation-box">' +
          '<div class="explanation-title">解説</div>' +
          '<p style="white-space: pre-wrap;">' + esc(q.explanation) + '</p>' +
        '</div>' +
        '<button id="' + nextBtnId + '">' + nextBtnText + '</button>';

      if (isLast) {
        document.getElementById('toResultBtn').addEventListener('click', function () {
          changeScreen('result');
        });
      } else {
        document.getElementById('nextBtn').addEventListener('click', function () {
          changeScreen('quiz', function() {
            state.currentQ++;
          });
        });
      }

    } else if (state.screen === 'result') {
      if (!state.saved) {
        saveScore(state.name, state.score);
        state.saved = true;
      }

      app.innerHTML =
        '<h1>採点結果</h1>' +
        '<p style="text-align:center; margin: 30px 0;">' +
          esc(state.name) + ' さんの得点<br>' +
          '<span style="font-size:2rem; font-weight:bold;">' + state.score + ' / ' + questions.length + '</span>' +
        '</p>' +
        '<button id="toRankingBtn">履歴を見る</button>' +
        '<button id="restartBtn" class="btn-outline">もう一度受験する</button>';

      document.getElementById('toRankingBtn').addEventListener('click', function () {
        changeScreen('ranking');
      });
      document.getElementById('restartBtn').addEventListener('click', function () {
        changeScreen('start', function() {
          state.name = '';
          state.currentQ = 0;
          state.score = 0;
          state.selectedAnswer = null;
          state.isCorrect = false;
          state.errorMsg = '';
          state.saved = false;
        });
      });

    } else if (state.screen === 'ranking') {
      const rankings = getRankings();
      let html = '<h1>履歴</h1>';

      if (rankings.length > 0) {
        html += '<table><thead><tr><th>順位</th><th>氏名</th><th>得点</th></tr></thead><tbody>';
        rankings.forEach(function (row, i) {
          html += '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td>' + esc(row.name) + '</td>' +
            '<td>' + row.score + ' / ' + questions.length + '</td>' +
          '</tr>';
        });
        html += '</tbody></table>';
      } else {
        html += '<p style="text-align:center; margin: 20px 0;">記録がありません。</p>';
      }

      html += '<button id="backBtn" class="btn-outline">トップに戻る</button>';
      app.innerHTML = html;

      document.getElementById('backBtn').addEventListener('click', function () {
        changeScreen('start', function() {
          state.name = '';
          state.currentQ = 0;
          state.score = 0;
          state.selectedAnswer = null;
          state.isCorrect = false;
          state.errorMsg = '';
          state.saved = false;
        });
      });
    }
  }

  function handleStart() {
    const input = document.getElementById('nameInput');
    const name = input.value.trim();
    if (name === '') {
      state.errorMsg = '名前を入れてください。';
      render();
      return;
    }
    changeScreen('quiz', function() {
      state.name = name;
      state.currentQ = 0;
      state.score = 0;
      state.errorMsg = '';
      state.saved = false;
    });
  }

  function handleAnswer(answerIndex) {
    const q = questions[state.currentQ];
    state.selectedAnswer = answerIndex;
    state.isCorrect = (answerIndex === q.correct);
    
    if (state.isCorrect) {
      state.score++;
    }
    
    state.screen = 'judge';
    render();
  }

  render();
})();
</script>
</body>
</html>
